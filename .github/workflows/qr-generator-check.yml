name: QR Generator checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "audit/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate document and inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const assert = (condition, message) => {
            if (!condition) {
              console.error('FAIL:', message);
              process.exitCode = 1;
            } else console.log('PASS:', message);
          };
          assert(/<!doctype html/i.test(html), 'HTML doctype exists');
          assert(/<html[\s>]/i.test(html) && /<\/html>/i.test(html), 'HTML root exists');
          assert(/qrcode-generator\/1\.4\.4\/qrcode\.min\.js/.test(html), 'QR encoder is loaded');
          assert(/qr\.isDark\(row, col\)/.test(html), 'real QR matrix is rendered');
          assert(!/Compute pseudo-random deterministic matrix/.test(html), 'pseudo QR code is removed');
          const english = fs.readFileSync('en/index.html', 'utf8');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          assert(/<html[^>]*lang="id"/i.test(html), 'Indonesian page declares its language');
          assert(/<html[^>]*lang="en"/i.test(english), 'English page declares its language');
          assert(html.includes('rel="canonical" href="https://qrnode.boothpro.my.id/"'), 'Indonesian canonical URL is present');
          assert(english.includes('rel="canonical" href="https://qrnode.boothpro.my.id/en/"'), 'English canonical URL is present');
          for (const [name, document] of [['Indonesian', html], ['English', english]]) {
            assert(/hreflang="id-ID"/.test(document) && /hreflang="en"/.test(document) && /hreflang="x-default"/.test(document), name + ' page has language alternatives');
          }
          assert(robots.includes('Sitemap: https://qrnode.boothpro.my.id/sitemap.xml'), 'robots.txt advertises the public sitemap');
          assert(sitemap.includes('https://qrnode.boothpro.my.id/') && sitemap.includes('https://qrnode.boothpro.my.id/en/'), 'sitemap includes both language URLs');
          assert(sitemap.includes('hreflang="id-ID"') && sitemap.includes('hreflang="en"') && sitemap.includes('hreflang="x-default"'), 'sitemap includes language alternates');
          const headers = (vercel.headers || []).flatMap(rule => rule.headers || []).map(header => [header.key.toLowerCase(), header.value]);
          for (const [key, value] of [['x-content-type-options', 'nosniff'], ['x-frame-options', 'DENY'], ['referrer-policy', 'strict-origin-when-cross-origin']]) {
            assert(headers.some(([actualKey, actualValue]) => actualKey === key && actualValue === value), 'security header configured: ' + key);
          }
          const anchors = [...html.matchAll(/<a\b[^>]*>/gi)].map(match => match[0]);
          const unsafeBlankLinks = anchors.filter(anchor => /\btarget\s*=\s*["']_blank["']/i.test(anchor) && !/\brel\s*=\s*["'][^"']*\bnoopener\b/i.test(anchor));
          assert(unsafeBlankLinks.length === 0, 'external new-tab links use rel=noopener');
          assert(/canvas\.dataset\.qrReady !== 'true'/.test(html), 'export checks QR readiness');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let count = 0;
          for (const [, attrs, code] of scripts) {
            if (/\bsrc\s*=/.test(attrs) || /\btype\s*=\s*["']application\/ld\+json["']/i.test(attrs) || !code.trim()) continue;
            const file = `/tmp/qr-inline-${count++}.js`;
            fs.writeFileSync(file, code);
            const check = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (check.status !== 0) {
              console.error(check.stderr || check.stdout);
              process.exitCode = 1;
            }
          }
          assert(count > 0, 'inline JavaScript syntax checked');
          if (process.exitCode) process.exit(process.exitCode);
          NODE

  qrnode-phase1-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate adopted module syntax and payload coverage
        run: |
          node --check qrnode-upgrade.js
          node scripts/check-qrnode-upgrade.js

  browser-qr-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright jsqr pngjs http-server
          npx playwright install --with-deps chromium
      - name: Serve page
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/qr-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr-http.log
          exit 1
      - name: Verify QR can be decoded
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const jsQR = require('jsqr');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => {
              const c = document.getElementById('qrCanvas');
              return c && c.dataset.qrReady === 'true';
            }, null, { timeout: 30000 });
            const result = await page.evaluate(() => {
              const c = document.getElementById('qrCanvas');
              const ctx = c.getContext('2d');
              const image = ctx.getImageData(0, 0, c.width, c.height);
              return { data: Array.from(image.data), width: image.width, height: image.height, payload: c.dataset.qrPayload };
            });
            const decoded = jsQR(new Uint8ClampedArray(result.data), result.width, result.height);
            if (!decoded) throw new Error('QR canvas rendered, but a QR decoder could not decode it.');
            if (decoded.data !== result.payload) throw new Error('Decoded payload does not match the input payload.');
            if (pageErrors.length) throw new Error(`Browser JavaScript errors: ${pageErrors.join(' | ')}`);
            const downloadPromise = page.waitForEvent('download', { timeout: 10000 });
            await page.locator('button[onclick="downloadQRImage()"]').click();
            const download = await downloadPromise;
            if (!download.suggestedFilename().endsWith('.png')) {
              throw new Error(`Expected a PNG download, received: ${download.suggestedFilename()}`);
            }
            const downloadPath = await download.path();
            const fs = require('node:fs');
            const pngHeader = fs.readFileSync(downloadPath).subarray(0, 8);
            if (pngHeader.toString('hex') !== '89504e470d0a1a0a') {
              throw new Error('Downloaded file does not have a valid PNG signature.');
            }
            async function verifyCategory(category, values, prefix) {
              await page.locator('#qrnodeSelect').selectOption(category);
              for (const [key, value] of Object.entries(values)) {
                const field = page.locator('[data-qrfield="' + key + '"]');
                if (key === 'security') await field.selectOption(value);
                else await field.fill(value);
              }
              await page.waitForFunction(() => {
                const c = document.getElementById('qrCanvas');
                return c && c.dataset.qrReady === 'true';
              }, null, { timeout: 10000 });
              const sample = await page.evaluate(() => {
                const source = document.getElementById('qrCanvas');
                const small = document.createElement('canvas');
                small.width = 600; small.height = 600;
                const ctx = small.getContext('2d');
                ctx.drawImage(source, 0, 0, 600, 600);
                const image = ctx.getImageData(0, 0, 600, 600);
                return { data: Array.from(image.data), payload: source.dataset.qrPayload };
              });
              if (!sample.payload.startsWith(prefix)) {
                throw new Error(category + ' payload prefix mismatch: ' + sample.payload.slice(0, 80));
              }
              const result = jsQR(new Uint8ClampedArray(sample.data), 600, 600);
              if (!result || result.data !== sample.payload) {
                throw new Error(category + ' QR failed independent decode or payload comparison.');
              }
              console.log('PASS: ' + category + ' payload validates and independently decodes.');
            }
            await verifyCategory('url', { url: 'https://example.org/qr-test' }, 'https://');
            await verifyCategory('text', { text: 'Halo dari QR Studio Pro' }, 'Halo dari');
            await verifyCategory('wa', { number: '6281234567890', message: 'Halo QR' }, 'https://wa.me/6281234567890');
            await verifyCategory('email', { to: 'halo@example.org', subject: 'Tes', body: 'Halo' }, 'mailto:halo@example.org');
            await verifyCategory('tel', { number: '+62215550188' }, 'tel:+62215550188');
            await verifyCategory('sms', { number: '+6281234567890', message: 'Tes SMS' }, 'smsto:6281234567890');
            await verifyCategory('wifi', { ssid: 'QR Booth WiFi', security: 'WPA', password: 'aman12345' }, 'WIFI:T:WPA;');
            await verifyCategory('vcard', { name: 'Rizki Test', org: 'QR Studio', phone: '+6281234567890', email: 'test@example.org' }, 'BEGIN:VCARD');
            await verifyCategory('geo', { lat: '-6.914744', lng: '107.609810', address: 'Bandung' }, 'geo:-6.914744,107.60981');
            await verifyCategory('event', { title: 'QR Test Event', start: '2026-11-03T10:00', end: '2026-11-03T11:00', location: 'Bandung' }, 'BEGIN:VCALENDAR');
            await verifyCategory('menu', { url: 'https://example.org/menu' }, 'https://example.org/menu');
            await verifyCategory('invitation', { url: 'https://example.org/invitation' }, 'https://example.org/invitation');
            await verifyCategory('review', { url: 'https://example.org/review' }, 'https://example.org/review');
            await verifyCategory('social', { url: 'https://example.org/social' }, 'https://example.org/social');
            await verifyCategory('pdf', { url: 'https://example.org/catalog.pdf' }, 'https://example.org/catalog.pdf');
            await verifyCategory('multilink', { url: 'https://example.org/links' }, 'https://example.org/links');
            await verifyCategory('form', { url: 'https://example.org/feedback' }, 'https://example.org/feedback');
            await verifyCategory('app', { url: 'https://example.org/app' }, 'https://example.org/app');
            for (const pattern of ['square', 'rounded', 'dots']) {
              await page.locator('#qrnodePattern').selectOption(pattern);
              await page.waitForFunction(() => {
                const c = document.getElementById('qrCanvas');
                return c && c.dataset.qrReady === 'true';
              }, null, { timeout: 10000 });
              const sample = await page.evaluate(() => {
                const source = document.getElementById('qrCanvas');
                const small = document.createElement('canvas');
                small.width = 600; small.height = 600;
                const ctx = small.getContext('2d');
                ctx.drawImage(source, 0, 0, 600, 600);
                const image = ctx.getImageData(0, 0, 600, 600);
                return { data: Array.from(image.data), payload: source.dataset.qrPayload };
              });
              const decodedPattern = jsQR(new Uint8ClampedArray(sample.data), 600, 600);
              if (!decodedPattern || decodedPattern.data !== sample.payload) {
                throw new Error(pattern + ' module pattern failed independent QR decoding.');
              }
              console.log('PASS: ' + pattern + ' module pattern independently decodes.');
            }
            await page.locator('#qrnodeSelect').selectOption('url');
            await page.locator('[data-qrfield="url"]').fill('not-a-valid-url');
            await page.waitForFunction(() => {
              const c = document.getElementById('qrCanvas');
              return c && c.dataset.qrReady === 'false';
            }, null, { timeout: 10000 });
            await page.locator('#qrnodePattern').selectOption('dots');
            const invalidStillBlocked = await page.locator('#qrCanvas').getAttribute('data-qr-ready');
            if (invalidStillBlocked !== 'false') {
              throw new Error('Changing the QR pattern bypassed invalid-payload validation.');
            }
            console.log('PASS: pattern changes keep invalid QR payloads blocked.');
            await page.locator('[data-qrfield="url"]').fill('https://example.org/svg-export-test');
            await page.waitForFunction(() => {
              const c = document.getElementById('qrCanvas');
              return c && c.dataset.qrReady === 'true';
            }, null, { timeout: 10000 });
            const svgPromise = page.waitForEvent('download', { timeout: 10000 });
            await page.locator('#qrSvgButton').click();
            const svgDownload = await svgPromise;
            const svgPath = await svgDownload.path();
            const svgText = fs.readFileSync(svgPath, 'utf8');
            if (!svgText.includes('<svg') || !svgText.includes('</svg>')) {
              throw new Error('SVG export did not produce a valid SVG document.');
            }
            console.log('PASS: SVG download contains a valid SVG document.');
            if (pageErrors.length) throw new Error('Browser JavaScript errors: ' + pageErrors.join(' | '));
            console.log('PASS: QR decodes to the expected payload, PNG download is valid, and the page has no uncaught JavaScript errors.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE


      - name: Exercise Premium Design Studio in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const { PNG } = require('pngjs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 950 }, acceptDownloads: true });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => {
              const c = document.getElementById('qrCanvas');
              return c && c.dataset.qrReady === 'true' && document.getElementById('qrnodeStudio');
            }, null, { timeout: 30000 });

            await page.locator('[data-preset="coffee"]').click();
            const coffee = await page.evaluate(() => ({
              foreground: document.getElementById('qrColor1')?.value,
              background: document.getElementById('qrBgColor')?.value,
              contrast: document.getElementById('qrnodeContrast')?.textContent || ''
            }));
            if (coffee.foreground?.toLowerCase() !== '#4b2e1e' || coffee.background?.toLowerCase() !== '#fff8ee') {
              throw new Error('Coffee preset did not update color controls: ' + JSON.stringify(coffee));
            }
            if (!/Kontras\s+[0-9.]+:1/.test(coffee.contrast) || !coffee.contrast.includes('Baik untuk pemindaian')) {
              throw new Error('Coffee preset contrast check failed: ' + coffee.contrast);
            }
            await page.locator('#qrColor2Hex').fill('#FFFFFF');
            const manualStatus = await page.locator('#qrnodeContrast').textContent();
            if (!manualStatus.includes('Ubah warna agar lebih mudah dipindai')) {
              throw new Error('Manual color edit did not refresh contrast status: ' + manualStatus);
            }
            for (const preset of ['gold','midnight','mono','coffee','forest']) {
              await page.locator('[data-preset="' + preset + '"]').click();
              const status = await page.locator('#qrnodeContrast').textContent();
              if (!status.includes('Baik untuk pemindaian')) throw new Error(preset + ' contrast failed: ' + status);
            }
            console.log('PASS: five presets and manual contrast updates.');

            const originalUrl = await page.locator('[data-qrfield="url"]').inputValue();
            await page.locator('#qrnodeSave').click();
            let saved = await page.evaluate(() => JSON.parse(localStorage.getItem('qrstudio.projects') || '[]'));
            if (saved.length !== 1 || saved[0].type !== 'url') throw new Error('Save project failed.');
            await page.locator('[data-qrfield="url"]').fill('https://changed.example/test');
            await page.locator('#qrnodeProjects button').first().click();
            if (await page.locator('[data-qrfield="url"]').inputValue() !== originalUrl) throw new Error('Load project failed.');
            await page.locator('#qrnodeProjects button').last().click();
            saved = await page.evaluate(() => JSON.parse(localStorage.getItem('qrstudio.projects') || '[]'));
            if (saved.length !== 0) throw new Error('Delete project failed.');
            console.log('PASS: save, load, delete project round-trip.');

            const sponsorLinkResult = await page.evaluate(() => {
              const link = document.getElementById('pubHeaderBannerLink');
              if (!link || typeof renderPublicAds !== 'function') {
                throw new Error('Sponsor banner link or renderer is missing.');
              }
              const previous = {
                sponsorLink: appState.config.sponsorLink,
                adMode: appState.config.adMode
              };
              appState.config.adMode = 'sponsor';
              appState.config.sponsorLink = 'https://example.org/sponsor';
              renderPublicAds();
              const configured = link.getAttribute('href');
              appState.config.sponsorLink = '';
              renderPublicAds();
              const cleared = link.getAttribute('href');
              appState.config.sponsorLink = 'javascript:alert(document.domain)';
              renderPublicAds();
              const unsafeBanner = link.getAttribute('href');
              const unsafeUrl = safeHttpUrl(appState.config.sponsorLink);
              appState.config.sponsorLink = previous.sponsorLink;
              appState.config.adMode = previous.adMode;
              renderPublicAds();
              return { configured, cleared, unsafeBanner, unsafeUrl };
            });
            if (sponsorLinkResult.configured !== 'https://example.org/sponsor') {
              throw new Error('Sponsor banner did not apply the configured URL: ' + JSON.stringify(sponsorLinkResult));
            }
            if (sponsorLinkResult.cleared !== '#') {
              throw new Error('Clearing sponsor URL left a stale banner destination: ' + JSON.stringify(sponsorLinkResult));
            }
            if (sponsorLinkResult.unsafeBanner !== '#' || sponsorLinkResult.unsafeUrl !== '#') {
              throw new Error('Unsafe sponsor URL was not neutralized by the public banner and URL validator: ' + JSON.stringify(sponsorLinkResult));
            }
            console.log('PASS: sponsor URLs update, clear stale destinations, and reject javascript: URLs in banner and sponsor slot.');

            const pngPromise = page.waitForEvent('download', { timeout: 15000 });
            await page.locator('#qrnodePng2048').click();
            const pngDownload = await pngPromise;
            const png = PNG.sync.read(fs.readFileSync(await pngDownload.path()));
            if (png.width !== 2048 || png.height !== 2048) throw new Error('PNG is not 2048x2048.');
            const svgPromise = page.waitForEvent('download', { timeout: 15000 });
            await page.locator('#qrSvgButton').click();
            const svgDownload = await svgPromise;
            const svg = fs.readFileSync(await svgDownload.path(), 'utf8');
            if (!svg.includes('<svg') || !svg.includes('</svg>') || !svg.includes('<rect')) throw new Error('SVG export invalid.');
            if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
            console.log('PASS: 2048px PNG, SVG export, no uncaught browser errors.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE


      - name: Verify responsive layouts on phone and tablet viewports
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => {
              const canvas = document.getElementById('qrCanvas');
              return canvas && canvas.dataset.qrReady === 'true';
            }, null, { timeout: 30000 });

            const viewports = [
              { name: 'small phone', width: 320, height: 740 },
              { name: 'phone', width: 375, height: 812 },
              { name: 'large phone', width: 430, height: 932 },
              { name: 'tablet portrait', width: 768, height: 1024 },
              { name: 'tablet landscape / small laptop', width: 1024, height: 768 }
            ];

            for (const viewport of viewports) {
              await page.setViewportSize({ width: viewport.width, height: viewport.height });
              await page.waitForTimeout(100);
              const result = await page.evaluate(() => {
                const visible = element => {
                  const style = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' &&
                    rect.width > 0 && rect.height > 0;
                };
                const rect = selector => {
                  const element = document.querySelector(selector);
                  if (!element || !visible(element)) return null;
                  const box = element.getBoundingClientRect();
                  return { left: box.left, right: box.right, width: box.width };
                };
                const controls = [...document.querySelectorAll(
                  '#view-generator button, #view-generator input:not([type=file]), #view-generator select, #view-generator textarea'
                )].filter(visible);
                const outOfBounds = controls.map(element => {
                  const box = element.getBoundingClientRect();
                  return { label: (element.innerText || element.getAttribute('aria-label') || element.id || element.tagName).trim().slice(0, 70), left: box.left, right: box.right };
                }).filter(box => box.left < -1 || box.right > window.innerWidth + 1);
                return {
                  viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  bodyWidth: document.body.scrollWidth,
                  qrFrame: rect('#qrFrameWrapper'),
                  qrCanvas: rect('#qrCanvas'),
                  downloadButton: rect('button[onclick="downloadQRImage()"]'),
                  shareButton: rect('button[onclick="shareQRMobile()"]'),
                  outOfBounds
                };
              });
              if (result.documentWidth > viewport.width + 2 || result.bodyWidth > viewport.width + 2) {
                throw new Error(viewport.name + ': horizontal page overflow: ' + JSON.stringify(result));
              }
              for (const key of ['qrFrame', 'qrCanvas', 'downloadButton', 'shareButton']) {
                const box = result[key];
                if (!box || box.width <= 0 || box.left < -1 || box.right > viewport.width + 1) {
                  throw new Error(viewport.name + ': required generator element is missing or clipped (' + key + '): ' + JSON.stringify(result));
                }
              }
              if (result.outOfBounds.length) {
                throw new Error(viewport.name + ': visible generator controls extend beyond viewport: ' + JSON.stringify(result.outOfBounds));
              }
              console.log('PASS: ' + viewport.name + ' ' + viewport.width + 'x' + viewport.height + ' — no horizontal overflow; QR and primary actions fit.');
            }
            if (errors.length) throw new Error('Browser JavaScript errors: ' + errors.join(' | '));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE


  admin-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test admin authentication handlers
        run: node scripts/test-admin-auth.js
