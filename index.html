<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembuat Kode QR Kustom Gratis</title>
    <!-- Menggunakan Tailwind CSS versi CDN resmi untuk tampilan modern -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Pustaka QR Code Generator resmi dari CDNJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto p-4 flex flex-col md:flex-row gap-6 mt-10">
        <!-- Area Utama Alat Bantu -->
        <div class="flex-1 bg-white p-6 rounded-2xl shadow-md">
            <h1 class="text-2xl font-bold text-center mb-6 text-indigo-600">Advanced QR Code Generator</h1>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Masukkan Tautan / Teks:</label>
                    <input type="text" id="qr-text" placeholder="https://facebook.com" class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium mb-1">Warna QR:</label>
                        <input type="color" id="qr-color" value="#000000" class="w-full h-10 border rounded-xl p-1 bg-white cursor-pointer">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium mb-1">Warna Latar:</label>
                        <input type="color" id="bg-color" value="#ffffff" class="w-full h-10 border rounded-xl p-1 bg-white cursor-pointer">
                    </div>
                </div>
                
                <button onclick="generateQR()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-xl transition duration-200 cursor-pointer">Buat QR Code</button>
            </div>

            <!-- Tempat Menampilkan Hasil QR -->
            <div class="mt-8 flex flex-col items-center justify-center min-h-[250px] border-2 border-dashed border-gray-200 rounded-2xl p-4 bg-gray-50">
                <div id="qrcode" class="p-2 bg-white rounded-lg shadow-sm"></div>
                <button id="download-btn" onclick="downloadQR()" class="hidden mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-xl transition duration-200 cursor-pointer">Unduh Gambar (PNG)</button>
            </div>
        </div>

        <!-- AREA TEMPAT IKLAN GOOGLE ADSENSE -->
        <div class="w-full md:w-[300px] flex flex-col gap-4">
            <div class="bg-gray-200 text-gray-500 border border-gray-300 h-[250px] rounded-2xl flex items-center justify-center font-medium text-sm text-center p-4">
                [ Slot Iklan AdSense Samping ]<br>Otomatis muncul setelah disetujui Google
            </div>
            <div class="bg-gray-200 text-gray-500 border border-gray-300 h-[250px] rounded-2xl flex items-center justify-center font-medium text-sm text-center p-4">
                [ Slot Iklan AdSense Samping 2 ]
            </div>
        </div>
    </div>

    <script>
        let qrcodeInstance = null;

        function generateQR() {
            const text = document.getElementById("qr-text").value;
            const qrColor = document.getElementById("qr-color").value;
            const bgColor = document.getElementById("bg-color").value;
            const qrContainer = document.getElementById("qrcode");
            const downloadBtn = document.getElementById("download-btn");

            if (!text.trim()) {
                alert("Silakan masukkan teks atau link terlebih dahulu!");
                return;
            }

            qrContainer.innerHTML = ""; // Bersihkan QR sebelumnya

            qrcodeInstance = new QRCode(qrContainer, {
                text: text,
                width: 250,
                height: 250,
                colorDark: qrColor,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });

            // Menunggu sebentar hingga gambar QR selesai di-generate oleh library
            setTimeout(() => {
                const qrImg = document.querySelector("#qrcode img");
                if (qrImg) {
                    downloadBtn.classList.remove("hidden");
                }
            }, 100);
        }

        function downloadQR() {
            const qrImg = document.querySelector("#qrcode img");
            const qrCanvas = document.querySelector("#qrcode canvas");
            const downloadBtn = document.getElementById("download-btn");
            
            let targetSrc = "";
            if (qrImg && qrImg.src) {
                targetSrc = qrImg.src;
            } else if (qrCanvas) {
                targetSrc = qrCanvas.toDataURL("image/png");
            }

            if (!targetSrc) {
                alert("Gagal mengunduh, silakan buat ulang QR Code!");
                return;
            }

            const link = document.createElement("a");
            link.href = targetSrc;
            link.download = "qrcode-kustom.png";
            link.click();
        }
    </script>
</body>
</html>
