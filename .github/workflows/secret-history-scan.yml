name: Full Git History Secret Scan

on:
  push:
    branches:
      - fix/qrnode-phase1-adoption-2026-11-02
  pull_request:
    branches:
      - lock/qr-studio-pro-premium-v3-2026-10-15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-history:
    name: Scan all fetched Git refs and history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history and refs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all reachable commits with Gitleaks (redacted output)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --no-banner --no-color --log-opts=--all /repo
