<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced QR Code Generator - Pembuat Kode QR Kustom Gratis</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6LJHMEM73Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6LJHMEM73Y');
    </script>
    
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 flex flex-col min-h-screen">
    <!-- Konten Utama Pembuat QR Code -->
    <div class="flex-grow max-w-4xl w-full mx-auto p-4 flex flex-col md:flex-row gap-6 mt-6">
        <div class="flex-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h1 class="text-2xl font-bold text-center mb-2 text-indigo-600">Advanced QR Code Generator</h1>
            <p class="text-sm text-gray-500 text-center mb-6">Buat QR Code berwarna secara instan & gratis.</p>
            
            <div class="space-y-4">
                <input type="text" id="qr-text" placeholder="Contoh: https://wa.me" class="w-full p-3 border border-gray-300 rounded-xl text-sm">
                <button onclick="generateQR()" class="w-full bg-indigo-600 text-white font-semibold p-3 rounded-xl text-sm">Buat QR Code</button>
            </div>
            <div class="mt-6 flex flex-col items-center justify-center min-h-[220px] border-2 border-dashed border-gray-200 rounded-2xl p-4 bg-gray-50">
                <div id="qrcode" class="p-2 bg-white rounded-lg shadow-sm"></div>
                <button id="download-btn" onclick="downloadQR()" class="hidden mt-4 bg-emerald-600 text-white px-6 py-2 rounded-xl text-sm">Unduh Gambar (PNG)</button>
            </div>
        </div>
    </div>
    <script>
        function generateQR() {
            const text = document.getElementById("qr-text").value;
            if (!text.trim()) { alert("Masukkan teks/link!"); return; }
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: text, width: 200, height: 200 });
            document.getElementById("download-btn").classList.remove("hidden");
        }
    </script>
</body>
</html>
